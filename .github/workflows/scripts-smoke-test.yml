name: REAP verification scripts smoke test

on:
  schedule:
    # 13:00 UTC on the 1st of every month
    - cron: "0 13 1 * *"
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/skills/reap-deal-underwriter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      - name: Run fixture-based unit tests
        run: python -m pytest tests -q

      - name: Run live smoke test against real APIs and sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python scripts/smoke_test_live.py
